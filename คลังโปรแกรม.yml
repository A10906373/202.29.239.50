A '''computer program''' is a [[sequence]] or set{{efn|The [[Prolog]] language allows for a database of facts and rules to be entered in any order. However, a question about a database must be at the very end.}} of instructions in a [[programming language]] for a [[computer]] to [[Execution (computing)|execute]]. It is one component of [[software]], which also includes [[software documentation|documentation]] and other intangible components.<ref name="ISO 2020">{{cite web
 | title=ISO/IEC 2382:2015
 | website=ISO
 | date=2020-09-03
 | url=https://www.iso.org/obp/ui/#iso:std:iso-iec:2382:ed-1:v1:en
 | access-date=2022-05-26
 | quote=[Software includes] all or part of the programs, procedures, rules, and associated documentation of an information processing system.
 | archive-date=2016-06-17
 | archive-url=https://web.archive.org/web/20160617031837/https://www.iso.org/obp/ui/#iso:std:iso-iec:2382:ed-1:v1:en
 | url-status=live
 }}</ref>

A ''computer program'' in its [[human-readable]] form is called [[source code]]. Source code needs another computer program to execute because computers can only execute their native [[machine instructions]]. Therefore, source code may be [[Translator (computing)|translated]] to machine instructions using a [[compiler]] written for the language. ([[Assembly language]] programs are translated using an [[Assembler (computing)|assembler]].) The resulting file is called an [[executable]]. Alternatively, source code may execute within an [[interpreter (computing)|interpreter]] written for the language.<ref name="cpl_3rd-ch1-7_quoted">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 7
  | quote = An alternative to compiling a source program is to use an interpreter. An interpreter can directly execute a source program[.]
  | isbn = 0-201-71012-9
}}</ref>

If the executable is requested for execution,{{efn|Either the user or another program makes the request.}} then the [[operating system]] [[Loader (computing)|loads]] it into [[Random-access memory|memory]]<ref name="lpi-ch2-p22_quote">{{cite book
 |title=The Linux Programming Interface
 |last=Kerrisk
 |first=Michael
 |publisher=No Starch Press
 |year=2010
 |isbn=978-1-59327-220-3
 |quote = The kernel can load a new program into memory[.]
 |page=22}}</ref> and starts a [[Process (computing)|process]].<ref name="osc-ch4-p98_quote">{{cite book
  | last = Silberschatz
  | first = Abraham
  | title = Operating System Concepts, Fourth Edition
  | publisher = Addison-Wesley
  | year = 1994
  | page = 98
  | quote = Informally, a process is a program in execution.
  | isbn = 978-0-201-50480-4
}}</ref> The [[central processing unit]] will soon [[Context switch|switch]] to this process so it can [[Instruction cycle|fetch, decode, and then execute]] each machine instruction.<ref name="sco-ch2-p32">{{cite book
  | last = Tanenbaum
  | first = Andrew S.
  | title = Structured Computer Organization, Third Edition
  | publisher = Prentice Hall
  | year = 1990
  | page = [https://archive.org/details/structuredcomput00tane/page/32 32]
  | isbn = 978-0-13-854662-5
  | url = https://archive.org/details/structuredcomput00tane/page/32
  }}</ref>

If the source code is requested for execution, then the operating system loads the corresponding interpreter into memory and starts a process. The interpreter then loads the source code into memory to translate and execute each [[Statement (computer science)|statement]]. Running the source code is slower than running an executable.<ref name="cpl_3rd-ch1-7">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 7
  | isbn = 0-201-71012-9
}}</ref>{{efn|An executable has each [[machine instruction]] ready for the [[CPU]].}} Moreover, the interpreter must be installed on the computer.

==Example computer program==

The [["Hello, World!" program]] is used to illustrate a language's basic syntax. The syntax of the language [[Dartmouth BASIC|BASIC]] (1964) was intentionally limited to make the language easy to learn.<ref name="cpl_3rd-ch2-30_quote1">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 30
  | isbn = 0-201-71012-9
  | quote = Their intention was to produce a language that was very simple for students to learn[.]
}}</ref> For example, [[Variable (computer science)|variables]] are not [[Declaration (computer programming)|declared]] before being used.<ref name="cpl_3rd-ch2-31">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 31
  | isbn = 0-201-71012-9
}}</ref> Also, variables are automatically initialized to zero.<ref name="cpl_3rd-ch2-31"/> Here is an example computer program, in Basic, to [[average]] a list of numbers:<ref name="cpl_3rd-ch2-30">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 30
  | isbn = 0-201-71012-9
}}</ref>
<syntaxhighlight lang="basic">
10 INPUT "How many numbers to average?", A
20 FOR I = 1 TO A
30 INPUT "Enter number:", B
40 LET C = C + B
50 NEXT I
60 LET D = C/A
70 PRINT "The average is", D
80 END
</syntaxhighlight>

Once the mechanics of basic computer programming are learned, more sophisticated and powerful languages are available to build large computer systems.<ref name="cpl_3rd-ch2-30_quote2">{{cite book
  | last = Wilson
  | first = Leslie B.
  | title = Comparative Programming Languages, Third Edition
  | publisher = Addison-Wesley
  | year = 2001
  | page = 30
  | isbn = 0-201-71012-9
  | quote = The idea was that students could be merely casual users or go on from Basic to more sophisticated and powerful languages[.]
}}</ref>

==History==
{{See also|Computer programming#History|Programmer#History|History of computing|History of programming languages|History of software}}

Improvements in [[software development]] are the result of improvements in [[computer hardware]]. At each stage in hardware's history, the task of [[computer programming]] changed dramatically.

