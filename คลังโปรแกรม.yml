[[File:JavaScript_code.png|thumb|[[Source code]] for a computer program written in the [[JavaScript]] language. It demonstrates the <code>appendChild()</code> method. The method adds a new child node to an existing parent node. It is commonly used to dynamically modify the structure of an HTML document.]]
