สิ่งที่คุณจะได้เรียนรู้
พื้นฐาน HMI และ SKTool7.1
เริ่มจากศูนย์ — สร้างโปรเจกต์, ออกแบบหน้าจอ, ใช้ Control ต่างๆ จนถึงระบบ Alarm, Data Logging, Recipe, C Scripting และ Barcode (15 บทเรียนต่อเนื่อง)
