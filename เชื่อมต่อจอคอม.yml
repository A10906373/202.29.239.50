ตั้งค่า Font ภาษาไทย, Calibrate หน้าจอ, อัพเดท Firmware, Boot Logo และการ Troubleshoot เบื้องต้น
คำถามที่พบบ่อย
HMI คืออะไร?
HMI (Human-Machine Interface) คือหน้าจอสัมผัสที่ใช้แสดงสถานะและรับคำสั่งจากผู้ใช้งานในระบบควบคุมอุตสาหกรรม ทำหน้าที่เป็นสะพานระหว่างคน (Operator) กับเครื่องจักร (PLC) แทนที่ตู้คอนโทรลแบบเก่าที่มีปุ่มกดและไฟแสดงสถานะจำนวนมาก
เลือกขนาดหน้าจอ HMI 7 นิ้ว 10 นิ้ว หรือ 15 นิ้ว ดีกว่ากัน?
7 นิ้ว เหมาะกับเครื่องจักรขนาดเล็ก-กลาง ตู้คอนโทรลพื้นที่จำกัด งบประหยัด (2,490-6,990 บาท) ส่วน 10.2 นิ้ว เหมาะกับเครื่องจักรกลางที่ต้องแสดงข้อมูลหลายตัว เช่น Trend Chart, Recipe (5,690-9,550 บาท) ส่วน 15.6 นิ้ว เหมาะกับห้อง Control Room หรือ SCADA Workstation ที่ Operator ยืนดูจากระยะ 1-2 เมตร (รุ่น SK-156QS-G + WiFi Module ราคา 17,550 บาท)
HMI Samkoon ใช้กับ PLC ยี่ห้อไหนได้บ้าง?
HMI Samkoon (SK Series) รองรับ Driver สำหรับ PLC แทบทุกยี่ห้อหลัก เช่น Mitsubishi (FX, Q, L), Siemens (S7-200, S7-1200, S7-300), OMRON (CJ, CP, CS), Delta, Panasonic, Schneider, Allen-Bradley, รวมถึง PLC จีน (Samkoon, Wecon) ผ่าน Modbus RTU/TCP เลือก Driver ใน SKTool ตั้งค่า COM Port ก็ใช้งานได้ทันที
HMI Touch Screen กับ HMI ปุ่มกดแบบเก่า ต่างกันยังไง?
Touch Screen ปรับ UI ได้อิสระผ่าน Software (เปลี่ยนหน้าจอ, ภาษา, Layout ได้โดยไม่ต้องเปลี่ยนฮาร์ดแวร์) แสดง Trend Chart, Alarm History, Recipe ได้ ส่วน HMI ปุ่มกดแบบเก่าทำได้แค่กดและดูไฟแสดง ฟังก์ชันจำกัดและพื้นที่หน้าตู้แพง ปัจจุบัน Touch Screen ราคาเริ่มต้น 3,000 บาทก็มีแล้ว ไม่ค่อยมีเหตุผลให้ใช้แบบปุ่มกดในเครื่องใหม่
HMI รุ่น Q (เช่น SK-070QE) ต่างจากรุ่นปกติยังไง?
รุ่นที่ลงท้ายด้วยตัว Q มีหลาย COM Port (COM1 + COM2 + COM3) เปิดให้ต่อ PLC, Servo, VFD พร้อมกันบน HMI ตัวเดียว แต่ละ Port ตั้ง Protocol และ Baudrate แยกกันได้ เหมาะกับเครื่องจักรที่มีอุปกรณ์หลายยี่ห้อในระบบเดียว ราคาแพงกว่ารุ่นปกติประมาณ 1,000-2,000 บาท
HMI Samkoon รองรับภาษาไทยไหม?
รองรับเต็มตัว — SKTool ติดตั้ง Font ภาษาไทย (Tahoma, Sarabun) ได้ผ่านเมนู Project Settings แสดงผลภาษาไทยได้ทุกขนาดตัวอักษร นอกจากนี้ยังรองรับ Multi-Language Switch ให้ Operator สลับภาษาได้ระหว่างไทย/อังกฤษ/จีน บนหน้าจอเดียว
